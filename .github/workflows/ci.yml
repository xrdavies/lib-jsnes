name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:wasm
      - run: node --input-type=module -e "import {readFile} from 'node:fs/promises'; const m=await WebAssembly.instantiate(await readFile('dist-wasm/lib-jsnes.wasm'),{env:{abort(){throw Error('wasm abort')}}}); const e=m.instance.exports; const r=new Uint8Array(16+0x4000); r.set([78,69,83,26,1,0]); r.set([169,42,76,0,128],16); r[16+0x3ffc]=0; r[16+0x3ffd]=128; for(let i=0;i<r.length;i++)e.romWrite(i,r[i]); e.loadRom(r.length); e.reset(); e.step(64); if(e.cycleCount()!==64||e.programCounter()!==0x8000||e.frameLength()!==61440) process.exit(1)"
