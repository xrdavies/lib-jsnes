<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lib-jsnes browser example</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
  canvas { width: 100%; height: auto; image-rendering: pixelated; background: #000; }
</style>
<h1>lib-jsnes</h1>
<p><label>NES ROM <input id="rom" type="file" accept=".nes"></label>
<label><input id="wasm" type="checkbox" checked> Use WASM for next ROM</label>
<button id="pause" type="button" disabled>Pause</button>
<button id="audio" type="button">Enable audio</button></p>
<canvas id="screen" width="256" height="240" aria-label="NES game screen"></canvas>
<p id="status" role="status">Choose a ROM. Keyboard: arrows, Z, X, Enter, Shift.</p>
<script type="module">
  import { Nes, WasmCore, NTSC_FRAME_RATE, Button } from '../dist/index.js';
  const input = document.querySelector('#rom'), wasmInput = document.querySelector('#wasm'), pause = document.querySelector('#pause'), audioButton = document.querySelector('#audio'), canvas = document.querySelector('#screen');
  const context = canvas.getContext('2d'), status = document.querySelector('#status');
  let generation = 0, animation = null, paused = false, last = 0, elapsed = 0, nes;
  let audioContext, audioGain, audioAt = 0;
  const image = context?.createImageData(256, 240);
  const keys = new Map([
    ['ArrowUp', Button.Up], ['ArrowDown', Button.Down], ['ArrowLeft', Button.Left], ['ArrowRight', Button.Right],
    ['KeyZ', Button.A], ['KeyX', Button.B], ['Enter', Button.Start], ['ShiftLeft', Button.Select], ['ShiftRight', Button.Select],
  ]);
  let buttons = 0;
  if (!context) { input.disabled = true; status.textContent = 'Canvas 2D is unavailable.'; }
  function stop() {
    if (animation !== null) cancelAnimationFrame(animation);
    animation = null; elapsed = 0;
    audioAt = 0;
    if (audioGain) { audioGain.disconnect(); audioGain = audioContext.createGain(); audioGain.connect(audioContext.destination); }
  }
  function start() {
    if (!nes || paused || document.hidden || animation !== null) return;
    last = performance.now();
    animation = requestAnimationFrame(frame);
  }
  input.addEventListener('change', async () => {
    const file = input.files[0]; if (!file) return;
    const load = ++generation, useWasm = wasmInput.checked;
    stop(); nes = null; paused = false; pause.disabled = true; pause.textContent = 'Pause';
    context.clearRect(0, 0, 256, 240); status.textContent = 'Loading…';
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      if (load !== generation) return;
      let candidate;
      if (useWasm) {
        candidate = await WasmCore.from(await fetch('../dist-wasm/lib-jsnes.wasm'));
        if (load !== generation) return;
        candidate.loadRom(bytes);
      } else candidate = new Nes(bytes);
      candidate.reset();
      nes = candidate; pause.disabled = false; status.textContent = audioContext ? 'Ready.' : 'Ready. Audio is muted.';
      start();
    } catch (error) { if (load === generation) status.textContent = `Failed: ${error.message}`; }
  });
  audioButton.addEventListener('click', async () => {
    try {
      if (!('AudioContext' in globalThis)) throw new Error('Web Audio is unavailable');
      if (!audioContext) {
        audioContext = new AudioContext(); audioGain = audioContext.createGain(); audioGain.connect(audioContext.destination);
      }
      await audioContext.resume(); audioButton.textContent = 'Audio enabled'; audioButton.disabled = true;
    } catch (error) { status.textContent = `Audio unavailable: ${error.message}`; }
  });
  addEventListener('blur', () => { buttons = 0; if (nes) nes.setController(1, 0); });
  addEventListener('keydown', event => {
    const bit = keys.get(event.code); if (bit === undefined) return;
    event.preventDefault(); buttons |= bit; if (nes) nes.setController(1, buttons);
  });
  addEventListener('keyup', event => {
    const bit = keys.get(event.code); if (bit === undefined) return;
    event.preventDefault(); buttons &= ~bit; if (nes) nes.setController(1, buttons);
  });
  pause.addEventListener('click', () => {
    if (!nes) return;
    paused = !paused; pause.textContent = paused ? 'Resume' : 'Pause';
    if (paused) { stop(); status.textContent = 'Paused.'; } else start();
  });
  document.addEventListener('visibilitychange', () => { stop(); start(); });
  addEventListener('pagehide', () => { stop(); if (audioContext) audioContext.suspend(); });
  function frame(now) {
    animation = null;
    if (!nes || paused || document.hidden) return;
    try {
      // ponytail: cap catch-up at 100 ms; sustained slow hosts need adaptive presentation.
      elapsed = Math.min(elapsed + Math.max(0, now - last), 100); last = now;
      while (elapsed >= 1000 / NTSC_FRAME_RATE) {
        nes.runFrame(); scheduleAudio(nes.audioSamples());
        elapsed -= 1000 / NTSC_FRAME_RATE;
      }
      image.data.set(nes.frameRgba()); context.putImageData(image, 0, 0);
      status.textContent = `${nes.cycleCount} CPU cycles · Audio muted`;
      animation = requestAnimationFrame(frame);
    } catch (error) {
      stop(); nes = null; pause.disabled = true; status.textContent = `Failed: ${error.message}`;
    }
  }
  function scheduleAudio(samples) {
    if (!audioContext || !samples.length) return;
    const buffer = audioContext.createBuffer(1, samples.length, nes.sampleRate ?? nes.apu.sampleRate);
    const channel = buffer.getChannelData(0);
    for (let i = 0; i < samples.length; i++) channel[i] = samples[i] / 32768;
    audioAt = Math.max(audioAt, audioContext.currentTime + 0.02);
    const source = audioContext.createBufferSource(); source.buffer = buffer; source.connect(audioGain); source.start(audioAt);
    audioAt += buffer.duration;
  }
</script>
</html>
